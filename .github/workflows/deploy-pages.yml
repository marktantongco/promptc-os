name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NEXT_OUTPUT: export
        run: |
          # Override next.config.ts for static export
          node -e "
            const fs = require('fs');
            const config = require('./next.config.ts');
            const newConfig = {
              output: 'export',
              typescript: { ignoreBuildErrors: true },
              reactStrictMode: false,
              images: { unoptimized: true },
              basePath: '/promptc-os',
              assetPrefix: '/promptc-os',
            };
            fs.writeFileSync('next.config.mjs', 'export default ' + JSON.stringify(newConfig, null, 2));
          "
          rm -f next.config.ts
          npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Temporarily remove API routes for static export
        run: |
          # API routes cannot be statically exported — move them aside
          mv src/app/api src/app/_api_disabled

      - name: Build static export
        env:
          NEXT_STATIC_EXPORT: "true"
        run: npm run build

      - name: Restore API routes
        if: always()
        run: |
          # Restore API routes so they stay in the repo
          if [ -d src/app/_api_disabled ]; then
            mv src/app/_api_disabled src/app/api
          fi

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
